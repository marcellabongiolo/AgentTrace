# Private-only Compose stack; do not publish directly to the internet.
# Usage: AGENTTRACE_API_KEY=<secret> docker compose -f docker-compose.private.yml up --build
services:
  api:
    build:
      context: .
    environment:
      AGENTTRACE_DATABASE: /data/agenttrace.db
      AGENTTRACE_CORS_ORIGINS: http://localhost:3000
      AGENTTRACE_API_KEY: ${AGENTTRACE_API_KEY:?Set AGENTTRACE_API_KEY before starting}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - agenttrace-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 10s
      timeout: 3s
      retries: 5

  dashboard:
    build:
      context: ./web
    environment:
      AGENTTRACE_DASHBOARD_PASSWORD: ${AGENTTRACE_DASHBOARD_PASSWORD:?Set a dashboard password of at least 12 characters}
      AGENTTRACE_SESSION_SECRET: ${AGENTTRACE_SESSION_SECRET:?Set a random session secret of at least 32 characters}
      AGENTTRACE_DASHBOARD_ORIGIN: ${AGENTTRACE_DASHBOARD_ORIGIN:-http://localhost:3000}
      AGENTTRACE_INTERNAL_API_URL: http://api:8000
      AGENTTRACE_API_KEY: ${AGENTTRACE_API_KEY:?Set AGENTTRACE_API_KEY before starting}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  agenttrace-data:
