[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agenttrace"
version = "0.1.0"
description = "Structured observability and tracing for AI-agent applications."
readme = "README.md"
authors = [
    { name = "Marcella Bongiolo" }
]
license = { text = "Apache-2.0" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
keywords = ["ai", "agents", "observability", "tracing", "telemetry", "llmops"]
dependencies = [
    "requests>=2.28.0",
    "pydantic>=2.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]
requires-python = ">=3.10"

[project.urls]
"Homepage" = "https://github.com/marcellabongiolo/AgentTrace"
"Bug Tracker" = "https://github.com/marcellabongiolo/AgentTrace/issues"
"Documentation" = "https://github.com/marcellabongiolo/AgentTrace#readme"

[tool.setuptools.packages.find]
where = ["."]
include = ["agenttrace*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "httpx>=0.27.0",
]


[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.coverage.run]
source = ["agenttrace"]
omit = ["agenttrace/examples/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
