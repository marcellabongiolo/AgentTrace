[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agenttrace"
version = "0.1.0"
description = "Open-source observability, tracing, and real-time guardrails for autonomous AI agents."
readme = "README.md"
authors = [
    { name = "Marcella Bongiolo" }
]
license = { text = "Apache-2.0" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
keywords = ["ai", "agents", "observability", "tracing", "llm", "llmops", "guardrails"]
dependencies = [
    "requests>=2.28.0",
    "pydantic>=2.0.0",
]
requires-python = ">=3.9"

[project.urls]
"Homepage" = "https://github.com/marcellabongiolo/AgentTrace"
"Bug Tracker" = "https://github.com/marcellabongiolo/AgentTrace/issues"
"Documentation" = "https://github.com/marcellabongiolo/AgentTrace#readme"

[tool.setuptools.packages.find]
where = ["."]
include = ["agenttrace*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
