name: CI

on:
  push:
  pull_request:

jobs:
  python-quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - name: Run tests with coverage
        run: pytest -q --cov=agenttrace --cov-report=term-missing

  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Verify production login, protected reads and logout
        run: node tests/auth-smoke.mjs
      - run: npm audit --audit-level=high

  docker-build:
    runs-on: ubuntu-latest
    env:
      AGENTTRACE_API_KEY: ci-only-api-key
      AGENTTRACE_DASHBOARD_PASSWORD: ci-only-dashboard-password
      AGENTTRACE_SESSION_SECRET: ci-only-session-secret-at-least-32-characters

    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t agenttrace-api:ci .
      - name: Build dashboard image
        run: docker build -t agenttrace-dashboard:ci ./web
      - name: Validate compose file
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.private.yml config --quiet
